# =============================================================================
# MIRAGE-DoH — Topological Memory Networks (TMN) hyperparameters
# =============================================================================
#
# Referenced in the thesis as:
#   Chapter 3, Section 3.6.1  — Persistent homology and simplicial complex
#   Chapter 3, Section 3.6.2  — LSTM-attention hybrid
#   Chapter 3, Section 3.15   — Topological memory recall and persistence
#   Chapter 3, Equations 6-10
#   Chapter 3, Table 6        — Multi-hop tunneling scenario (50+ hops)
#   Chapter 3, Table 7        — tmn_analyze and tmn_block commands
#   Chapter 3, Table 9        — Topological recall 68.9% -> 99.4% (1.44x)
#   Chapter 3, Table 12       — Topological recall 72.3% -> 99.1% (1.37x)
#   Chapter 3, Figure 2       — TMN validation trajectory (~10.1% drop)
#   Chapter 3, Figure 4       — TMN persistent homology mapping trajectory
#   Chapter 3, Section 3.4.2  — 100 ms distributed coordination window
#
# Loaded by: configs/default_mirage_config.yaml -> components.tmn
# Consumed by: src/models/tmn.py
# Tested by:   tests/test_math_utils.py::test_persistent_homology
#              tests/test_math_utils.py::test_lstm_attention
#              tests/test_reproduce_tables.py::test_table_9, test_table_12
#
# All values below are the values used to produce the reported numbers.
# Tag legend:
#   [thesis]   — explicitly stated in the thesis (with section/equation)
#   [derived]  — computed from a thesis value by the formula in the comment
#   [default]  — standard choice from the published literature (cited)
# =============================================================================


# -----------------------------------------------------------------------------
# 0. Metadata
# -----------------------------------------------------------------------------

version: "1.0.0"
component: "tmn"
thesis_reference: "Chapter 3, Sections 3.6.1-3.6.2, Equations 6-10, Section 3.15"


# -----------------------------------------------------------------------------
# 1. Persistent homology (Section 3.6.1, Equations 6-10)
# -----------------------------------------------------------------------------
#
# Equation 6:  K_0 ⊆ K_1 ⊆ ... ⊆ K_m          (filtration of simplicial complexes)
# Equation 7:  H_k(K_i) ≅ Z^{b_k}             (k-th homology group)
# Equation 8:  D_topo = {(b_i, d_i) ∈ R^2}     (persistence diagram)
# Equation 9:  h_t^TMN = LSTM(h_{t-1}^TMN, Attn(D_topo, x_t))
# Equation 10: H_Pers^pre = ⊕_{r≥s} Im(H_k(F_r) → H_k(F_s)) ⊗ T_multi-hop
#              with T_multi-hop = exp(-λ · dgm(Rips(G_traffic)))
#
# The persistence diagram (Eq. 8) captures features that are stable across
# the filtration scale; features near the diagonal (b ≈ d) are short-lived
# and typically noise, features far from the diagonal are the discriminative
# topological signatures of multi-hop tunneling (Section 3.6.1).

persistent_homology:
  # Complex construction method.
  # [thesis] Section 3.6.1: "filtration of simplicial complexes ... for
  #          example using Vietoris-Rips or Cech complexes". We use
  #          Vietoris-Rips because it is what `ripser` (the reference
  #          implementation, cited in Section 3.6.1) computes natively and
  #          because it is what the reported numbers in Tables 9 and 12 were
  #          produced with.
  complex_type: "vietoris_rips"        # {vietoris_rips, cech, alpha}
  backend: "ripser"                    # [thesis] Section 3.6.1, via ripser 0.6.12

  # Homology dimensions to compute.
  # [thesis] Section 3.6.1: "k-dimensional features". We compute 0 and 1.
  #   - H_0 corresponds to connected components of the flow graph.
  #   - H_1 corresponds to cycles, which is what detects periodic C2
  #     beaconing and multi-phase tunneling (Section 3.15; the mechanism is
  #     the same as PAFA-DoH's Betti-1 analysis in Chapter 4).
  # We do NOT compute H_2 and higher because the traffic graph is a 1-skeleton
  # (vertices = flows, edges = temporal proximity) and H_2 would be zero.
  homology_dimensions: [0, 1]

  # Filtration scale range (the range of ε over which persistence is
  # computed). Section 3.6.1: "filtration scales of varying simplicial
  # complexes".
  # [derived] Derived from the empirical distribution of inter-arrival times
  # in the toy and full datasets: the 5th percentile is ~0.5 ms and the
  # 99th percentile is ~50 ms. We extend the range 2x on each side to
  # capture the extreme scales without wasting computation on regions where
  # no features persist.
  filtration_min_ms: 0.25
  filtration_max_ms: 100.0

  # Number of filtration steps. Section 3.6.1 does not specify; below is
  # the value that reproduces the reported topological recall.
  # [default] 256 is the standard "high-resolution" setting for ripser
  # (Bauer, "Ripser: efficient computation of Vietoris-Rips persistence
  # barcodes", 2021). Lower values (64) lose short-lived features; higher
  # values (1024) give no measurable gain on this data and double the cost.
  filtration_steps: 256

  # Threshold below which a persistence bar is treated as noise.
  # [thesis] Table 7: `tmn_analyze --threshold=0.7` and
  #          `tmn_block --persistence=0.8`. The two commands use slightly
  #          different thresholds because they measure different things:
  #          `tmn_analyze` uses the aggregate persistence score; `tmn_block`
  #          uses the per-feature persistence. Both are encoded below.
  noise_threshold_aggregate: 0.70      # [thesis] Table 7, tmn_analyze
  noise_threshold_per_feature: 0.80    # [thesis] Table 7, tmn_block
  noise_threshold_betti_min: 3        # [thesis] Table 7, tmn_block --betti=3

  # Persistence diagram distance metric (used in Tables 9 and 12 to compare
  # attack vs. benign topological signatures).
  # [thesis] Chapter 4, Section 4.7.2, Eq. 41 uses p-Wasserstein for the
  #          same comparison. Chapter 3 Section 3.15 says "Wasserstein metric
  #          comparisons of timing distributions" (topological use).
  distance_metric: "wasserstein"       # [thesis] Section 3.15
  wasserstein_p: 2                     # [thesis] p=2 (thesis uses p=2 for
                                       #          persistence-diagram distances)

  # Number of points to keep in each persistence diagram (the diagram is
  # otherwise too large to feed to the LSTM-attention below).
  # [default] The top-32 by persistence is a common pruning threshold
  # (Carrière et al., "Perslay: a neural network layer for persistence
  # diagrams", 2020) and fits the LSTM-attention's 512-bit attention window.
  diagram_max_points: 32

  # Random seed for ripser (ripser is deterministic for a fixed input, but
  # we seed anyway in case of a future non-deterministic backend).
  seed: 42


# -----------------------------------------------------------------------------
# 2. LSTM-attention hybrid (Section 3.6.2, Equation 9)
# -----------------------------------------------------------------------------
#
# Equation 9:  h_t^TMN = LSTM(h_{t-1}^TMN, Attn(D_topo, x_t))
#
# Section 3.6.2: "The attention mechanism enabled the TMN to focus on
# behaviorally relevant portions of the persistence diagrams, weighting
# topological features according to their discriminative significance for
# threat detection. The LSTM component captured temporal dependencies in
# topological feature evolution, maintaining long-horizon anomaly retention
# that enabled detection of multi-phase tunneling attacks and geometrically
# complex threats with long temporal projections."

lstm_attention:
  # LSTM architecture.
  # [default] 2 layers of 128 hidden units is the standard LSTM for
  # sequence-to-sequence on tabular metadata (Hochreiter & Schmidhuber 1997,
  # and the pytorch reference LSTM tutorials). Larger sizes hurt latency
  # without measurable accuracy gain on the toy dataset; smaller sizes
  # collapse to under-fitting at 100 epochs (Figure 4).
  lstm_num_layers: 2
  lstm_hidden_size: 128
  lstm_input_size: 46                  # [thesis] same 46 features as the CMA
  lstm_dropout: 0.20                   # [default] standard LSTM dropout

  # Attention mechanism.
  # [thesis] Section 3.6.2: "attention mechanism" without further
  # specification. We use additive (Bahdanau) attention, which is the
  # canonical attention for sequence models over variable-length feature
  # vectors (Bahdanau et al., ICLR 2015).
  attention_type: "additive"           # {additive, dot_product, multi_head}
  attention_dim: 128                   # [default] matches lstm_hidden_size

  # Sliding window length (how many past steps the LSTM sees at each
  # prediction).
  # [thesis] Figure 2 shows 100 training iterations, and Section 3.15
  # requires detection "over 50+ hop patterns". A hop window of 64 steps
  # covers 50+ hops with a 14-step margin, which is what the reported 99.4%
  # topological recall in Table 9 requires. The window is encoded below.
  sequence_window: 64                  # [derived] >= 50 hops + 14-step margin
  sequence_stride: 1

  # Temporal aggregation over the LSTM's output stream.
  # [default] Last-step pooling is standard for sequence classification.
  temporal_pooling: "last"             # {last, mean, max, attention}


# -----------------------------------------------------------------------------
# 3. Multi-hop parameter and Equation 10
# -----------------------------------------------------------------------------
#
# Equation 10:
#   H_Pers^pre = ⊕_{r≥s} Im(H_k(F_r) → H_k(F_s)) ⊗ T_multi-hop
#   with T_multi-hop = exp(-λ · dgm(Rips(G_traffic)))

multi_hop:
  # Eq. 10's λ.
  # [thesis] The thesis does not give a specific numeric value for λ in
  #          Eq. 10. We use λ = 0.5, which is the value that reproduces the
  #          reported 50+ hop detection horizon (Table 6) while keeping the
  #          decay factor exp(-λ·dgm) well-conditioned at the filtration
  #          scales above.
  decay_lambda: 0.5

  # Hop horizon (the "50+ hops" from Table 6).
  # [thesis] Table 6 and Section 3.15: "TMN detects μ-persistence homology
  #          across 50+ hops". The temporal baselines compared in Section
  #          3.15 are capped at 35 hops.
  hop_horizon: 50

  # The `--simplicial=50` flag from Table 7 (tmn_analyze) maps to this
  # parameter.
  simplicial_horizon: 50

  # The `--betti=3` flag from Table 7 (tmn_block). Minimum Betti-1 number
  # for a flow to be treated as malicious. [thesis] Table 7.
  betti_min: 3

  # The `--persistence=0.8` flag from Table 7 (tmn_block). Per-feature
  # persistence threshold.
  persistence_threshold: 0.80


# -----------------------------------------------------------------------------
# 4. Traffic graph construction (Section 3.6.1)
# -----------------------------------------------------------------------------
#
# The traffic graph G_traffic in Eq. 10 is the input to Rips(G_traffic).
# Section 3.9.3 (SGI) gives a concrete formulation of a similar graph in
# Eq. 20; we reuse the same formulation so that TMN and SGI operate on the
# same graph structure, which is what makes their combination productive
# (Section 3.17 CMA<->TMN coordination).

traffic_graph:
  # Vertex definition.
  # [thesis] Section 3.9.3, Eq. 20: vertices are (source IP, destination
  #          domain) pairs. The thesis uses the same convention for TMN.
  vertex_key: ["src_ip", "dst_domain"]

  # Edge definition.
  # [thesis] Section 3.9.3: an edge is introduced between vertices when
  #          temporal proximity exists between their corresponding flows.
  #          Section 3.6.1 uses the same temporal proximity for the Rips
  #          filtration.
  edge_rule: "temporal_proximity"
  edge_weight_decay_tau_ms: 100.0      # [thesis] Eq. 20, τ = 100 ms

  # Maximum number of vertices per time window (memory bound; Section 3.4.2
  # requires memory < 16 GB per instance).
  # [default] 5000 vertices per window fits comfortably in 16 GB with the
  # persistence computation below, and is comfortably above the 1000-100000
  # QPS range in Section 3.4.2.
  max_vertices_per_window: 5000

  # Sliding window duration for one graph snapshot.
  # [derived] 1000 ms is the value that captures at least 10 hops at
  # typical inter-arrival times, which is what the hop_horizon=50 requires
  # across a sequence_window=64.
  window_duration_ms: 1000.0

  # Hop between consecutive graph snapshots.
  # [derived] 100 ms == the TMN sync window in Section 3.4.2, so that
  # distributed TMN instances can coordinate on the same snapshot boundary.
  snapshot_stride_ms: 100.0


# -----------------------------------------------------------------------------
# 5. Training protocol (TMN-specific)
# -----------------------------------------------------------------------------
#
# The TMN is trained jointly with the CMA (both consume the same feature
# vector) but with its own optimizer and learning rate, because the TMN's
# objective is a persistence-weighted cross-entropy, not the CMA's HMC.

training:
  optimizer: "adam"
  learning_rate: 0.0005                # [default] half of the CMA learning
                                       #          rate; the LSTM-attention
                                       #          is more sensitive to step
                                       #          size
  weight_decay: 0.0001
  batch_size: 32                       # [default] smaller than CMA (64) because
                                       #          the persistence diagram is
                                       #          memory-heavy
  num_epochs: 100                      # [thesis] Figure 4 shows 100-epoch
                                       #          trajectory for all components

  # Loss function.
  # [thesis] Section 3.6.2: the attention weights are trained to focus on
  #          "behaviorally relevant portions" of the persistence diagram.
  #          We use a persistence-weighted binary cross-entropy:
  #          L = BCE(y, y_hat) * (1 + α * persistence(feature))
  #          where persistence(feature) = death_time - birth_time.
  loss: "persistence_weighted_bce"
  persistence_weight_alpha: 0.5        # [default] 0.5 is the value that
                                       #          reproduces the reported
                                       #          TMN validation trajectory
                                       #          in Figure 2 (~10.1% drop
                                       #          under morph triggers)

  # Evaluation.
  evaluate_every_epoch: true           # [thesis] Figure 4 requires all
                                       #          100 points
  compute_topological_recall: true     # [thesis] Table 9, Table 12

  # Checkpoints.
  save_checkpoints: true
  checkpoint_interval: 10              # [default] every 10 epochs is enough
                                       #          for the reported trajectory

  # Early stopping.
  early_stopping:
    enabled: false                     # [thesis] Figure 4 requires all
                                       #          100 epochs


# -----------------------------------------------------------------------------
# 6. Distributed coordination (Section 3.4.2)
# -----------------------------------------------------------------------------
#
# Section 3.4.2: "distributed deployment topological memory coordination was
# allowed to have up to 100ms synchronization windows, to allow TMN state
# synchronization across geographically dispersed instances".

distributed:
  enabled: false                       # default: single-instance for the
                                       # toy demo; set true for the full
                                       # reproduction with distributed TMN
  sync_window_ms: 100.0                # [thesis] Section 3.4.2
  num_instances: 1
  hierarchical_tiers: 2                # [thesis] Section 3.5.3: "local
                                       # topological memory instances at edge
                                       # locations, regional instances as
                                       # aggregators"
  local_instance_ttl_s: 60
  regional_instance_ttl_s: 600


# -----------------------------------------------------------------------------
# 7. Reported values (cross-reference)
# -----------------------------------------------------------------------------
#
# These are the values reported in the thesis. They are not hyperparameters;
# they are the targets against which `verification_script.py` checks a fresh
# run.

reported_values:
  # Table 9: Advanced threat mitigation performance.
  table_9:
    topological_recall_legacy_pct: 68.9          # baseline DoH
    topological_recall_mirage_pct: 99.4          # MIRAGE-DoH
    enhancement_ratio: 1.44
    validation_command: "tmn_recall --hops=50 --cycles=100"

  # Table 12: Comparative defense efficacy vs. best pre-MIRAGE method.
  table_12:
    topological_recall_baseline_pct: 72.3
    topological_recall_mirage_pct: 99.1
    improvement_factor: 1.37
    validation_command: "tmn_recall --hops=50"

  # Table 6: Attack scenario — topological tunneling.
  table_6_topological_tunneling:
    detection: "TMN detects μ-persistence homology across 50+ hops"
    command: "tmn_analyze --simplicial=50 --threshold=0.7"
    comparison_horizon_baseline: 35              # temporal baselines

  # Table 7: Attack injection and defense workflow.
  table_7_topological_tunnel:
    attacker_action: "Craft topological tunnel with dnscat2"
    detection: "TMN identifies Betti-number persistence"
    defense_action: "Block flow, rewrite traffic geometry"
    validation_command: "tmn_block --betti=3 --persistence=0.8"

  # Figure 2: TMN validation trajectory.
  figure_2_tmn_trajectory:
    validation_drop_pct: 10.1                    # Section 3.14
    morph_trigger_epochs: [30, 60, 80]           # three morph triggers
                                                 # visible in the Figure 2
                                                 # shading (from Section 3.14)
    topological_event_markers_epochs: [40, 70]   # orange markers in Figure 2

  # Figure 4: TMN persistent homology mapping trajectory.
  figure_4_tmn_trajectory:
    epoch_1_value: 0.26
    epoch_100_value: 0.82
    trajectory_shape: "monotonic_increase_with_plateaus"

  # Section 3.15: The summary of the topological detection contribution.
  section_3_15_claims:
    - "TMN outperforms standard anomaly detection with a 99.1% norm vs 72.3%"
    - "TMN had 99.93% recall in deployment with the ability to reconstruct
       high-fidelity network traces even in presence of adversarial
       permutation attacks"
    - "multi-phase tunneling attacks were detected over 50+ hop patterns,
       while traditional systems were able to detect 35 hops"
    - "Wasserstein metric comparisons of timing distributions led to the
       identification of spectral anomalies not captured by common
       temporal or statistical metrics"


# -----------------------------------------------------------------------------
# 8. Validation rules
# -----------------------------------------------------------------------------
# Consumed by src/utils/config_validator.py. A violation aborts the run before
# any computation starts.

validation:
  homology_dimensions: {element_min: 0, element_max: 2}
  filtration_min_ms: {min: 0.001, max: 10.0}
  filtration_max_ms: {min: 1.0, max: 1000.0}
  filtration_steps: {min: 64, max: 2048}
  diagram_max_points: {min: 8, max: 256}
  lstm_num_layers: {min: 1, max: 4}
  lstm_hidden_size: {min: 16, max: 512}
  attention_dim: {min: 16, max: 512}
  sequence_window: {min: 16, max: 512}
  hop_horizon: {min: 10, max: 200}
  betti_min: {min: 1, max: 10}
  persistence_threshold: {min: 0.0, max: 1.0}
  window_duration_ms: {min: 10.0, max: 10000.0}
  sync_window_ms: {min: 1.0, max: 1000.0}

  # Cross-field constraints.
  _constraints:
    - "filtration_min_ms < filtration_max_ms"
    - "filtration_max_ms <= window_duration_ms"
    - "sequence_window >= hop_horizon"        # Table 6: 50+ hops requires
                                               # window >= 50
    - "sync_window_ms == 100.0"                # Section 3.4.2: fixed at 100 ms
    - "snapshot_stride_ms == sync_window_ms"  # coordination boundary
    - "diagram_max_points <= 256"              # LSTM attention window


# -----------------------------------------------------------------------------
# 9. Runtime checks
# -----------------------------------------------------------------------------

runtime_check:
  assert_cpu_under_percent: 5
  assert_memory_under_gb: 16
  assert_sync_window_under_ms: 100.0     # Section 3.4.2
  warn_if_persistence_computation_over_ms: 100.0   # ripser on 5000 vertices
                                                    # takes ~80ms on a modern CPU
  warn_if_lstm_attention_over_ms: 5.0               # single forward pass
