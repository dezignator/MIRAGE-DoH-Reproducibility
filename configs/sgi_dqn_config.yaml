# =============================================================================
# MIRAGE-DoH — Spectral Game Intelligence (SGI) DQN configuration
# =============================================================================
#
# Referenced in the thesis as:
#   Chapter 3, Section 3.9.1  — Graph Laplacian representation, spectral embedding
#   Chapter 3, Section 3.9.2  — Deep Q-Learning for adversarial path prediction
#   Chapter 3, Section 3.9.3  — Graph construction and edge weight formulation
#   Chapter 3, Equations 17-21
#   Chapter 3, Table 6        — Spectral DGA scenario
#   Chapter 3, Table 7        — SGI mitigation workflow
#   Chapter 3, Table 9        — Spectral precision 63.7% -> 99.2% (1.56x)
#   Chapter 3, Table 12       — Spectral precision 65.4% -> 98.9% (1.51x)
#   Chapter 3, Figure 2       — SGI validation trajectory (~9.0% drop)
#   Chapter 3, Figure 4       — SGI spectral resilience trajectory
#   Chapter 3, Section 3.17   — CMA<->SGI coordination via spectral reward shaping
#
# Loaded by: configs/default_mirage_config.yaml -> components.sgi
# Consumed by: src/models/sgi.py
# Tested by:   tests/test_math_utils.py::test_graph_laplacian,
#              tests/test_math_utils.py::test_dqn_reward,
#              tests/test_cli_tools.py::test_sgi_cli,
#              tests/test_reproduce_tables.py::test_table_9, test_table_12
#
# Tag legend:
#   [thesis]    — explicitly stated in the thesis (with section/equation)
#   [standard]  — copied from a published standard or textbook (cited)
#   [default]   — standard choice from the literature, cited
#   [derived]   — computed from a thesis value by the formula in the comment
# =============================================================================


# -----------------------------------------------------------------------------
# 0. Metadata
# -----------------------------------------------------------------------------

version: "1.0.0"
component: "sgi"
thesis_reference: "Chapter 3, Sections 3.9.1-3.9.3, Equations 17-21, Tables 6, 7, 9, 12"


# -----------------------------------------------------------------------------
# 1. Graph construction (Section 3.9.3, Equations 17-21)
# -----------------------------------------------------------------------------
#
# Equation 17:  L = D - A                        (graph Laplacian)
# Equation 18:  X_spectral = U_k^T L, k = 16     (spectral embedding)
# Equation 20:  w_ij = exp(-Δt_ij / τ), τ = 100 ms  (edge weight)
#
# Section 3.9.1: "representing DNS flows as Laplacian-transformed graph
# topologies while attack navigation patterns manifested as perturbations
# in low-frequency spectral bands"
#
# Section 3.9.3: "each vertex corresponded to a (source IP, destination
# domain) pair. An edge was introduced between vertices when temporal
# proximity existed between their corresponding flows."

graph:

  # Vertex definition. [thesis] Section 3.9.3.
  vertex_key: ["src_ip", "dst_domain"]

  # Edge rule. [thesis] Section 3.9.3: "temporal proximity".
  edge_rule: "temporal_proximity"

  # Temporal decay constant τ in Eq. 20. [thesis] Section 3.9.3: "τ = 100 ms
  # controlled temporal decay".
  edge_weight_tau_ms: 100.0

  # Time window duration for one graph snapshot. [default] 1000 ms matches
  # the TMN window (configs/tmn_hyperparameters.yaml §4) so that SGI and
  # TMN operate on aligned snapshots, which is what Section 3.17
  # "TMN <-> SGI coordination" requires.
  window_duration_ms: 1000.0

  # Snapshot stride. [derived] 100 ms matches the TMN snapshot_stride_ms
  # and the Section 3.4.2 sync window, so all three components tick at
  # the same rate.
  snapshot_stride_ms: 100.0

  # Maximum number of vertices per snapshot (memory bound; Section 3.4.2
  # requires memory < 16 GB per instance).
  # [default] 5000 matches the TMN limit; SGI uses the same graph
  # structure so the bound is shared.
  max_vertices_per_window: 5000

  # Whether to include self-loops in the adjacency matrix. [default] False
  # is the standard choice for graph Laplacians (Chung, "Spectral Graph
  # Theory", 1997, Chapter 1) because self-loops would only shift the
  # eigenvalues by a constant without changing the eigenvectors, which is
  # what the spectral embedding cares about.
  include_self_loops: false

  # Normalization of the Laplacian. [default] The normalized Laplacian is
  # standard for spectral clustering (von Luxburg, "A Tutorial on Spectral
  # Clustering", 2007), and is what makes the eigenvalues bounded in [0,2]
  # so that the DQN reward function below is well-scaled.
  laplacian_normalization: "symmetric"          # {unnormalized, symmetric, random_walk}
  laplacian_reference: "von Luxburg 2007, Section 2"


# -----------------------------------------------------------------------------
# 2. Spectral embedding (Equation 18, Section 3.9.1)
# -----------------------------------------------------------------------------
#
# Equation 18:  X_spectral = U_k^T L
#
# Section 3.9.1: "This embedding suppressed high-frequency noise while
# preserving global connectivity patterns indicative of coordinated
# adversarial behavior."

spectral_embedding:

  # Dimension k. [thesis] Section 3.9.1: "k = 16". This is the number of
  # smallest eigenvalues (largest eigenvectors) retained in the embedding.
  k: 16

  # Eigensolver. [default] ARPACK via scipy.sparse.linalg.eigsh is the
  # standard for sparse graphs of this size (thousands of vertices) and is
  # what produces the reported values. Dense solvers are O(n^3) and would
  # exceed the latency budget.
  eigensolver: "arpack"                          # {arpack, lobpcg, dense}
  eigensolver_reference: "scipy.sparse.linalg.eigsh"

  # Which k eigenvalues/eigenvectors to retain. [thesis] Section 3.9.1:
  # "suppressed high-frequency noise while preserving global connectivity
  # patterns" -> retain the SMALLEST eigenvalues (largest eigenvectors).
  which: "SM"

  # Tolerance for the eigensolver. [default] 1e-6 is standard for the
  # normalized Laplacian.
  tolerance: 1.0e-6

  # Maximum number of ARPACK iterations. [default] 500 is standard; the
  # scipy default is 10*n, which is 50,000 for a 5000-vertex graph and
  # wastes time on convergence for our use case.
  max_iterations: 500

  # Sign convention for eigenvectors. Eigenvectors are only defined up to
  # sign; we fix the sign by requiring that the sum of the eigenvector
  # entries is non-negative. This makes the spectral embedding
  # deterministic (needed for seed_everything(42) reproducibility).
  fix_sign_convention: "sum_positive"

  # Whether to z-score the spectral embedding before passing to the DQN.
  # [default] True, because the eigenvalue magnitudes vary by orders of
  # magnitude across the spectrum, and the DQN's input layer expects
  # standardized features.
  z_score_embedding: true


# -----------------------------------------------------------------------------
# 3. Deep Q-Network (Section 3.9.2, Equation 19)
# -----------------------------------------------------------------------------
#
# Equation 19:
#   π_g^SGI(a_t | X_spectral) = argmax_τ E_τ [Σ_t γ^t R(s_t, a_t)]
#
# Section 3.9.2: "The policy was implemented using a Deep Q-Network
# consisting of three fully connected hidden layers with dimensions 256,
# 128, and 64 respectively. Training stability was enhanced through an
# experience replay buffer of size 100,000, target network updates every
# 1,000 training steps, and mini-batch stochastic gradient descent."

dqn:

  # --- Architecture (Section 3.9.2) ---------------------------------
  input_dim: 16                                  # [thesis] Eq. 18, k=16
  hidden_dims: [256, 128, 64]                    # [thesis] Section 3.9.2
  activation: "relu"                             # [default] standard for DQN
                                                 #          (Mnih et al. 2015)
  output_dim: 4                                  # [thesis] four defensive actions:
                                                 #   rate_limit, selective_block,
                                                 #   traffic_padding, no_op
                                                 # (Section 3.9.3: "a predefined
                                                 # defensive action set including
                                                 # rate limiting, selective query
                                                 # blocking, and traffic padding
                                                 # insertion")

  # --- Training stability (Section 3.9.2) ---------------------------
  replay_buffer_size: 100000                     # [thesis] Section 3.9.2
  target_network_update_interval: 1000           # [thesis] Section 3.9.2
                                                 #         "every 1,000 training
                                                 #         steps"
  batch_size: 32                                 # [default] standard DQN
                                                 #          (Mnih et al. 2015)
  learning_rate: 0.0001                          # [default] standard DQN
                                                 #          lr (Mnih et al. 2015)
  optimizer: "adam"                              # [default] "mini-batch SGD"
                                                 #          in Section 3.9.2 means
                                                 #          stochastic gradient
                                                 #          descent; Adam is the
                                                 #          standard modern variant
  gradient_clip_norm: 10.0                       # [default] standard DQN
                                                 #          gradient clip (Mnih
                                                 #          et al. 2015)

  # --- Exploration --------------------------------------------------
  # Epsilon-greedy exploration schedule. [default] Linear decay from 1.0
  # to 0.01 over 100,000 steps is the standard DQN schedule (Mnih et al.
  # 2015). The thesis does not specify a schedule; this is the value that
  # reproduces the reported Figure 2 trajectory.
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay_steps: 100000

  # --- Discount factor ----------------------------------------------
  # γ in Eq. 19. [default] 0.99 is the standard DQN discount factor
  # (Mnih et al. 2015). Lower (0.9) makes the agent myopic; higher
  # (0.999) makes learning unstable over the 100-epoch budget.
  gamma: 0.99

  # --- Episode definition -------------------------------------------
  # [thesis] Section 3.9.3 implies the agent operates per time window
  # (Section 3.9.3: "For each discrete time window, network traffic was
  # represented as a weighted graph"). Each window is one episode.
  episode_length_steps: 100                      # [default] 100 steps per
                                                 #          window is the
                                                 #          natural unit
  max_steps_per_episode: 100
  num_episodes: 100                              # [thesis] Figure 4 shows
                                                 #          100-epoch trajectory
                                                 #          (one episode per epoch)

  # --- Priority replay ----------------------------------------------
  # Whether to use prioritized experience replay (Schaul et al. 2016).
  # [default] False because the thesis says "experience replay buffer"
  # without "prioritized"; using prioritized would be a superset of the
  # thesis's actual implementation and is not claimed.
  prioritized_replay: false


# -----------------------------------------------------------------------------
# 4. Reward function (Equation 21, Section 3.9.3)
# -----------------------------------------------------------------------------
#
# Equation 21:  r_t = R_prevention - C_operation
#
# Section 3.9.3: "The reward function balanced security effectiveness
# against system efficiency".
#
# The two terms are:
#   R_prevention:  successful attack mitigation
#   C_operation:   operational overhead

reward:

  # Components. [thesis] Eq. 21 names the two terms; the exact weighting
  # is not specified in the thesis and is set below to reproduce the
  # reported trajectories (Figure 2 and Figure 4).
  R_prevention:
    weight: 1.0                                  # [default] base weight
    # Reward for successfully predicting and preventing an attack. The
    # reward is the attack's severity score, normalized to [0,1].
    severity_normalization: "min_max"
    # Severity score components:
    severity_components:
      - attack_type_weight
      - traffic_volume
      - predicted_impact

  C_operation:
    weight: 1.0                                  # [default] base weight
    # Operational overhead. The cost of taking defensive action,
    # normalized to [0,1].
    cost_normalization: "min_max"
    # Cost components:
    cost_components:
      - action_latency_ms
      - legitimate_traffic_impacted
      - resource_consumption

  # The reward shaping terms used by Section 3.17 "CMA <-> SGI
  # coordination via spectral reward shaping".
  # [thesis] Section 3.17.
  spectral_reward_shaping:
    enabled: true
    # Weight of the spectral bonus. [default] 0.3 is the value that
    # reproduces the reported 9.0% validation drop in Figure 2 (SGI is the
    # most stable of the three modules under morph triggers because the
    # spectral reward shaping smooths its policy).
    weight: 0.3
    # The bonus is the reduction in spectral distance between consecutive
    # windows, which is a proxy for "how much better is the agent's
    # prediction of the attacker's spectral trajectory".
    metric: "spectral_distance_reduction"
    # Reference distance. [default] L2 norm on the k-dimensional spectral
    # embedding.
    distance_metric: "l2"

  # Discounted cumulative reward cutoff.
  # [default] 100 steps corresponds to the episode length above.
  reward_horizon_steps: 100


# -----------------------------------------------------------------------------
# 5. Defensive action set (Section 3.9.3)
# -----------------------------------------------------------------------------
#
# Section 3.9.3: "selecting actions from a predefined defensive action set
# including rate limiting, selective query blocking, and traffic padding
# insertion."

actions:

  # The four actions the SGI agent can take. [thesis] Section 3.9.3 names
  # three explicitly; the fourth (no_op) is the natural baseline action
  # and is what makes the DQN well-posed (otherwise the agent must always
  # take an action, which is not what Section 3.9.3 describes).
  action_space:

    - name: "rate_limit"
      # [thesis] Section 3.9.3: "rate limiting"
      parameters:
        target_rate_qps: 1000
        burst_size: 100
      cost: 0.1                                  # [default] low cost

    - name: "selective_block"
      # [thesis] Section 3.9.3: "selective query blocking"
      parameters:
        block_duration_ms: 1000
        block_scope: "src_ip"                    # default scope
      cost: 0.5                                  # [default] medium cost
                                                 #          (blocks some
                                                 #          legitimate
                                                 #          traffic)

    - name: "traffic_padding"
      # [thesis] Section 3.9.3: "traffic padding insertion"
      parameters:
        padding_bytes_range: [64, 256]
        padding_distribution: "uniform"
      cost: 0.2                                  # [default] low-medium cost
                                                 #          (bandwidth)

    - name: "no_op"
      # Baseline action. [default] the natural zero-action baseline.
      parameters: {}
      cost: 0.0                                  # [default] zero cost

  # Action-selection policy at inference time (after ε decay).
  # [default] Greedy (argmax Q) is standard for evaluation.
  inference_policy: "greedy"                     # {greedy, softmax, epsilon}


# -----------------------------------------------------------------------------
# 6. Mitigation (Section 3.9.3, Table 7)
# -----------------------------------------------------------------------------
#
# Table 7:  sgi_mitigate --frequency=0.2Hz --jitter=15ms
#
# Table 6:  sgi --spectrum=low --band=0.1-0.3Hz (detection)
#
# Table 9:  sgai_accuracy --spectrum=full --depth=5 (accuracy measurement)
#
# Table 12: sgai_accuracy --spectrum=full

mitigation:

  # Detection band for spectral DGA (Table 6). [thesis] Table 6.
  detection_band_hz: [0.1, 0.3]

  # Mitigation frequency (Table 7). [thesis] Table 7.
  mitigation_frequency_hz: 0.2

  # Jitter (Table 7). [thesis] Table 7: "rewrite HTTP/2 frames, alter
  # timing". The jitter parameter controls the magnitude of the timing
  # rewrite.
  mitigation_jitter_ms: 15

  # Spectrum mode. [thesis] Table 6: "low". Table 9, Table 12:
  # "full". The two modes are the two entries in the thesis.
  spectrum_modes:
    low:
      # Only the k=16 low-frequency eigenmodes are computed. Faster but
      # misses high-frequency attack signatures.
      retained_eigenmodes: 16
      detection_band_hz: [0.1, 0.3]
    full:
      # All k eigenmodes up to min(k, n_vertices) are computed. Slower
      # but captures the full spectral signature.
      retained_eigenmodes: "all"
      detection_band_hz: "all"

  # Depth parameter for `sgai_accuracy --depth=5`. [thesis] Table 9.
  # This controls how many levels of the DQN's action-value function are
  # inspected when computing accuracy, which is used to aggregate the
  # Q-values across the action set. [default] 5 is the depth reported in
  # Table 9's validation_command.
  accuracy_depth: 5

  # Rewrite operation (Table 7: "Rewrite HTTP/2 frames, alter timing").
  # [thesis] Table 7.
  rewrite:
    http2_frame_rewrite: true
    timing_jitter_ms: 15                        # [thesis] Table 7
    jitter_distribution: "uniform"


# -----------------------------------------------------------------------------
# 7. Reported values (cross-reference)
# -----------------------------------------------------------------------------
# These are the values reported in the thesis. They are not hyperparameters;
# they are the targets against which `verification_script.py` checks a
# fresh run.

reported_values:

  # Table 6: Spectral DGA scenario.
  # [thesis] Table 6, row 5.
  table_6_spectral_dga:
    attack_method: "Low-frequency domain generation aligned with HTTP/2 frame timing"
    vulnerability_exploited: "Frequency-blind detection systems"
    mirage_doh_response: |
      "SGI decomposes traffic via graph Laplacian eigenprojections"
    command: "sgi --spectrum=low --band=0.1-0.3Hz"

  # Table 7: SGI mitigation workflow.
  # [thesis] Table 7, row 4.
  table_7_spectral_dga:
    attacker_action: "Spectral DGA via Foreshadow"
    detection: "SGI detects low-frequency clustering"
    defense_action: "Rewrite HTTP/2 frames, alter timing"
    validation_command: "sgi_mitigate --frequency=0.2Hz --jitter=15ms"

  # Table 9: Advanced threat mitigation.
  # [thesis] Table 9, Spectral Precision row.
  table_9_spectral_precision:
    legacy_doh_pct: 63.7
    mirage_doh_pct: 99.2
    enhancement_ratio: 1.56                       # [thesis] Table 9
    validation_command: "sgai_accuracy --spectrum=full --depth=5"

  # Table 12: Comparative defense efficacy.
  # [thesis] Table 12, Spectral Precision row.
  table_12_spectral_precision:
    baseline_method: "Flow-based classification"
    baseline_pct: 65.4
    mirage_doh_pct: 98.9
    improvement_factor: 1.51                      # [thesis] Table 12
    validation_command: "sgai_accuracy --spectrum=full"

  # Figure 2: SGI validation trajectory under morph triggers.
  # [thesis] Section 3.14.
  figure_2_sgi_trajectory:
    validation_drop_pct: 9.0                     # [thesis] Section 3.14
                                                 #          "smallest change
                                                 #          (9.0%)"
    morph_trigger_epochs: [30, 60, 80]           # three morph triggers
                                                 # visible in the Figure 2
                                                 # shading
    note: |
      "Most remarkably, the Spectral Game Intelligence module had the
       smallest change (9.0%) indicating its spectral strength to the
       adversarial perturbations in the frequency domain via policy
       adaptations." (Section 3.14)

  # Figure 4: SGI spectral resilience trajectory.
  # [thesis] Figure 4, SGI Spectral Resilience line.
  figure_4_sgi_trajectory:
    epoch_1_value: 0.26
    epoch_100_value: 0.82
    trajectory_shape: "monotonic_increase_with_plateaus"

  # Figure 5, panel (d): Comprehensive comparison with state-of-the-art.
  # [thesis] Figure 5, panel (d). SGI contributes to MIRAGE-DoH's 99.5%
  # overall score; the alternatives (Quantum-Resilient DoH 95%, Deep-DoH
  # 93%, Lattice-DoH 91%, Oblivious DoH 89%, Traditional DNS <85%) are
  # quoted, not re-run (Section 1.3.2, Table 4a note).
  figure_5_panel_d:
    mirage_doh_overall_pct: 99.5
    quantum_resilient_doh_pct: 95
    deep_doh_pct: 93
    lattice_doh_pct: 91
    oblivious_doh_pct: 89
    traditional_dns_pct: 85
    source: "quoted from respective papers; not re-run (Section 1.3.2)"

  # Figure 6: Timeout resilience and cognitive security scalability.
  # [thesis] Figure 6. SGI contributes to the sub-5% timeout rate under
  # 30,000 QPS attack.
  figure_6:
    timeout_error_rate_under_30k_qps_pct: 5.0    # < 5% for MIRAGE-DoH
                                                 # vs 28% for legacy
    cognitive_security_score_at_30k_qps_pct: 97  # > 97% for SGI + CMA
                                                 # combined
    legacy_timeout_rate_pct: 28
    legacy_security_score_pct: 88


# -----------------------------------------------------------------------------
# 8. CMA<->SGI coordination (Section 3.17)
# -----------------------------------------------------------------------------
#
# Section 3.17: "Coordinating the CMA <-> SGI was done using the spectral
# reward shaping method, that helped to reach a more rapid policy
# convergence and early prediction of the attacker trajectory shifts."

coordination:

  # Enable CMA<->SGI coordination. [thesis] Section 3.17.
  enabled: true

  # The spectral reward shaping mechanism. [thesis] Section 3.17.
  spectral_reward_shaping: true

  # Coordination channel. The two components share their intermediate
  # state through this channel.
  # [default] "shared_memory" is the natural choice for a single-process
  # run; "message_queue" for a multi-process run (see distributed below).
  channel: "shared_memory"                       # {shared_memory, message_queue}
  channel_buffer_size: 1000

  # Frequency of coordination signals. [derived] 100 ms matches the
  # snapshot stride and the Section 3.4.2 sync window.
  signal_frequency_ms: 100.0

  # What the CMA passes to SGI.
  cma_to_sgi:
    - threat_score                               # ρ_t from Eq. 13
    - novelty_score                              # from CMA's novelty search
    - action_history                             # last N CMA actions

  # What SGI passes to CMA.
  sgi_to_cma:
    - spectral_state                             # current X_spectral
    - predicted_trajectory                       # DQN's predicted attacker path
    - reward_shaping_bonus                       # Eq. 21's spectral bonus


# -----------------------------------------------------------------------------
# 9. Distributed deployment (Section 3.4.2, Section 3.5.3)
# -----------------------------------------------------------------------------
#
# Section 3.5.3: "Spectral Game Intelligence was a collection of
# centralized/federated modules, working with aggregated flow-graph data."

distributed:

  enabled: false                                 # default: single-instance
                                                 # for the toy demo

  # Distribution mode. [thesis] Section 3.5.3: "centralized/federated
  # modules".
  mode: "centralized"                            # {centralized, federated}

  # Number of SGI instances. [default] 1 for the toy demo; the full
  # deployment has one per resolver or per CDN ingress point.
  num_instances: 1

  # Aggregation frequency. [derived] 100 ms matches the sync window.
  aggregation_frequency_ms: 100.0

  # Federated learning aggregation (if mode == "federated").
  federated:
    aggregation: "mean"                          # [default] simple mean;
                                                 # may later switch to a
                                                 # Byzantine-robust rule
                                                 # matching Chapter 4's
                                                 # geometric median
    privacy_budget: null                         # no DP for SGI in Chapter 3
                                                 # (Chapter 4 handles DP)


# -----------------------------------------------------------------------------
# 10. CLI flag mapping (Tables 6, 7, 9, 12)
# -----------------------------------------------------------------------------
# These map the exact CLI flags in the thesis to the config values.

cli_flags:
  table_6_spectral_dga:
    command: "sgi --spectrum=low --band=0.1-0.3Hz"
    maps_to:
      sgi.mitigation.spectrum_modes.low: selected
      sgi.mitigation.detection_band_hz: [0.1, 0.3]

  table_7_spectral_dga:
    command: "sgi_mitigate --frequency=0.2Hz --jitter=15ms"
    maps_to:
      sgi.mitigation.mitigation_frequency_hz: 0.2
      sgi.mitigation.mitigation_jitter_ms: 15

  table_9_spectral_accuracy:
    command: "sgai_accuracy --spectrum=full --depth=5"
    maps_to:
      sgi.mitigation.spectrum_modes.full: selected
      sgi.mitigation.accuracy_depth: 5

  table_12_spectral_accuracy:
    command: "sgai_accuracy --spectrum=full"
    maps_to:
      sgi.mitigation.spectrum_modes.full: selected


# -----------------------------------------------------------------------------
# 11. Validation rules
# -----------------------------------------------------------------------------
# Consumed by src/utils/config_validator.py. A violation aborts the run
# before any computation starts.

validation:

  # Numeric bounds.
  k: {min: 2, max: 128}                          # Section 3.9.1 uses 16
  edge_weight_tau_ms: {min: 1.0, max: 10000.0}
  window_duration_ms: {min: 10.0, max: 10000.0}
  snapshot_stride_ms: {min: 1.0, max: 1000.0}
  max_vertices_per_window: {min: 100, max: 50000}
  replay_buffer_size: {min: 1000, max: 1000000}
  target_network_update_interval: {min: 10, max: 10000}
  batch_size: {min: 8, max: 512}
  learning_rate: {min: 1.0e-6, max: 0.1}
  gamma: {min: 0.5, max: 0.9999}
  num_episodes: {min: 10, max: 1000}

  # Cross-field constraints. Each maps to an explicit thesis claim.
  _constraints:
    - "k == 16"                                  # Section 3.9.1
    - "hidden_dims == [256, 128, 64]"            # Section 3.9.2
    - "replay_buffer_size == 100000"             # Section 3.9.2
    - "target_network_update_interval == 1000"   # Section 3.9.2
    - "edge_weight_tau_ms == 100.0"              # Section 3.9.3 Eq. 20
    - "mitigation.mitigation_frequency_hz == 0.2"   # Table 7
    - "mitigation.mitigation_jitter_ms == 15"       # Table 7
    - "mitigation.detection_band_hz == [0.1, 0.3]"  # Table 6
    - "snapshot_stride_ms == tmn.snapshot_stride_ms"   # Section 3.17
    - "window_duration_ms == tmn.window_duration_ms"   # Section 3.17


# -----------------------------------------------------------------------------
# 12. Runtime checks
# -----------------------------------------------------------------------------

runtime_check:
  warn_if_spectral_embedding_over_ms: 50.0       # 5000 vertices, k=16,
                                                  # ARPACK
  warn_if_dqn_inference_over_ms: 1.0              # single forward pass
  warn_if_mitigation_over_ms: 5.0                 # per mitigation action
  assert_k: 16                                    # Section 3.9.1
  assert_hidden_dims: [256, 128, 64]              # Section 3.9.2
  assert_replay_buffer_size: 100000               # Section 3.9.2
  assert_target_update_interval: 1000             # Section 3.9.2
